name: test-and-deploy

on:
  schedule:
    - cron: "0 * * * *"   # every hour UTC
  workflow_dispatch:      # allow manual run

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (prod only)
        run: npm run test:prod-all
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/**/html-report

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: html-report
          path: reports/latest

      - name: Prepare reports folder and cleanup
        run: |
          mkdir -p reports
          timestamp=$(date -u +"%Y-%m-%dT%H-%M-%S-%3NZ")
          mv reports/latest reports/$timestamp

          cd reports || exit

          # Sort folders by modification time (newest first)
          all_dirs=$(ls -1dt 20* | head -n 1000)

          keep_dirs=$(echo "$all_dirs" | head -n 10)
          remove_dirs=$(echo "$all_dirs" | tail -n +11)

          keep_count=$(echo "$keep_dirs" | wc -l | tr -d ' ')
          remove_count=$(echo "$remove_dirs" | wc -l | tr -d ' ')

          echo "### All report folders:"
          echo "$all_dirs"

          if [ -n "$keep_dirs" ]; then
            echo "### Kept $keep_count report folders (clickable):"
            for dir in $keep_dirs; do
              echo "- [${dir}](https://tyagiviv.github.io/automation-tests/reports/${dir}/index.html)"
            done
          fi

          if [ -n "$remove_dirs" ]; then
            echo "### Removing $remove_count old report folders (clickable):"
            for dir in $remove_dirs; do
              echo "- [${dir}](https://tyagiviv.github.io/automation-tests/reports/${dir}/index.html)"
              rm -rf "$dir"
            done
          else
            echo "No old report folders to remove."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
