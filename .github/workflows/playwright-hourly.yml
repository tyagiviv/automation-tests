name: test-and-deploy

on:
  schedule:
    - cron: "0 * * * *"   # every hour UTC
  workflow_dispatch:      # allow manual run

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1   # faster, no full history

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (prod only)
        run: npm run test:prod-all
        continue-on-error: true

      - name: Upload reports
        if: always()   # upload reports even if tests fail
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/**/html-report

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: html-report
          path: reports/latest

      - name: Prepare reports folder
        run: |
          mkdir -p public/reports
          timestamp=$(date +"%Y-%m-%d_%H-%M-%S")
          mv reports/latest public/reports/$timestamp

          # Keep only last 10 reports and log removed ones
          cd public/reports
          old_dirs=$(ls -1dt */ | tail -n +11)
          if [ -n "$old_dirs" ]; then
            echo "Removing old report folders:"
            echo "$old_dirs"
            echo "$old_dirs" | xargs -r rm -rf
          else
            echo "No old report folders to remove."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true   # only update changed files
