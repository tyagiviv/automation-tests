name: test-and-deploy

on:
  schedule:
    - cron: "0 * * * *"   # every hour UTC
  workflow_dispatch:      # allow manual run

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache node_modules
        uses: actions/cache@v3
        with:
          path: node_modules
          key: node-modules-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-modules-${{ runner.os }}-

      - name: Install dependencies
        run: npm install

      - name: Cache Playwright browsers
        uses: actions/cache@v3
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}
          restore-keys: |
            playwright-browsers-${{ runner.os }}-

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests (prod only)
        run: npm run test:prod-all
        continue-on-error: true

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-report
          path: reports/**/html-report

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Download reports
        uses: actions/download-artifact@v4
        with:
          name: html-report
          path: reports/latest

      - name: Prepare reports folder and cleanup
        run: |
          mkdir -p public/reports
          timestamp=$(date +"%Y-%m-%d_%H-%M-%S")
          mv reports/latest public/reports/$timestamp

          cd public/reports || exit

          # List all directories starting with '20' sorted descending
          all_dirs=$(find . -maxdepth 1 -type d -name "20*" | sort -r)
          all_dirs_clean=$(echo "$all_dirs" | sed 's|^\./||')

          # Keep latest 10, remove the rest
          keep_dirs=$(echo "$all_dirs_clean" | head -n 10)
          remove_dirs=$(echo "$all_dirs_clean" | tail -n +11)

          # Log kept folders with clickable links
          if [ -n "$keep_dirs" ]; then
            echo "### Kept report folders (clickable links):"
            for dir in $keep_dirs; do
              echo "- [${dir}](https://tyagiviv.github.io/automation-tests/reports/${dir}/index.html)"
            done
          fi

          # Remove old folders and log
          if [ -n "$remove_dirs" ]; then
            echo "### Removing old report folders:"
            echo "$remove_dirs"
            echo "$remove_dirs" | xargs -r rm -rf
          else
            echo "No old report folders to remove."
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          keep_files: true
