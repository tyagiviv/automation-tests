name: Playwright Prod Hourly Run

on:
  schedule:
    # Run every hour at minute 0
    - cron: '0 * * * *'
  workflow_dispatch: # allows manual trigger

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run prod + API-prod Playwright tests
        run: npm run test:prod-all

      - name: Prepare reports for GitHub Pages
        run: |
          mkdir -p reports-gh-pages
          cp -r reports/* reports-gh-pages/
          cd reports-gh-pages
          # Keep only last 10 report folders (sorted by name)
          folders_to_delete=$(ls -1 | sort | head -n -10)
          if [ -n "$folders_to_delete" ]; then
            echo "Deleting old reports:"
            echo "$folders_to_delete"
            echo "$folders_to_delete" | xargs rm -rf
          fi
          cd ..

      - name: Deploy reports to GitHub Pages
        uses: peaceiris/actions-gh-pages@v6
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./reports-gh-pages
          publish_branch: gh-pages
          keep_files: true
